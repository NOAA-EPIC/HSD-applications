name: kokkos-protos CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-gpu-runner:
    name: Kokkos Protos (GPU + OpenMP + Serial)
    # Target the smallest GitHub-hosted GPU larger runner (4 vCPU, 28 GB RAM, 1x NVIDIA Tesla T4)
    # The runner label defaults to ubuntu-22.04-gpu but can be overridden by repo/org variable
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-22.04-gpu' }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "2G"
      OMP_NUM_THREADS: "4"
      OMP_PROC_BIND: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/kokkos-protos.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-cache-

      - name: Install build toolchain dependencies
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "1";' | sudo tee /etc/apt/apt.conf.d/01keep-debs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libomp-dev \
            gcc-12 \
            g++-12 \
            nvidia-cuda-toolkit
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
          echo "CUDAHOSTCXX=g++-12" >> $GITHUB_ENV

      - name: Configure CUDA Environment
        run: |
          echo "=== Locating CUDA Toolkit ==="
          CUDA_DIR=""
          if [ -d "/usr/local/cuda" ]; then
            CUDA_DIR="/usr/local/cuda"
          elif ls -d /usr/local/cuda-* >/dev/null 2>&1; then
            CUDA_DIR=$(ls -d /usr/local/cuda-* | sort -V | tail -n 1)
          fi

          if [ -n "$CUDA_DIR" ] && [ -x "$CUDA_DIR/bin/nvcc" ]; then
            echo "Found pre-installed CUDA Toolkit at: $CUDA_DIR"
            echo "$CUDA_DIR/bin" >> $GITHUB_PATH
            echo "CUDA_PATH=$CUDA_DIR" >> $GITHUB_ENV
            echo "CUDAToolkit_ROOT=$CUDA_DIR" >> $GITHUB_ENV
            echo "CUDACXX=$CUDA_DIR/bin/nvcc" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$CUDA_DIR/lib64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          else
            echo "Using system-installed nvcc at: $(which nvcc || echo 'not found')"
            echo "CUDACXX=$(which nvcc)" >> $GITHUB_ENV
          fi

      - name: Verify GPU presence and hardware
        run: |
          echo "=== PCI Devices (NVIDIA / Display) ==="
          lspci | grep -i -E "nvidia|3d|vga" || echo "No NVIDIA PCI device found on system bus!"
          echo "=== Kernel Modules (NVIDIA) ==="
          lsmod | grep -i nvidia || echo "No nvidia kernel module loaded initially."
          echo "=== Attempting to load NVIDIA kernel modules ==="
          sudo modprobe nvidia || echo "modprobe nvidia failed"
          sudo modprobe nvidia-uvm || echo "modprobe nvidia-uvm failed"
          echo "=== Kernel Log (NVIDIA) ==="
          dmesg | grep -i nvidia | tail -n 20 || true
          echo "=== NVIDIA Driver & Device Status ==="
          nvidia-smi
          echo "=== Host Compiler Status ==="
          gcc --version
          g++ --version
          echo "=== NVCC Compiler Status ==="
          nvcc --version || true
          echo "=== Host Hardware Status ==="
          lscpu || true
          free -h

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-kokkos-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kokkos-ccache-

      - name: Cache Kokkos FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: kokkos-protos/build/_deps
          key: ${{ runner.os }}-kokkos-fetchcontent-${{ hashFiles('kokkos-protos/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-kokkos-fetchcontent-

      - name: Initialize ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache -z
          ccache -s

      - name: Configure CMake (Serial + OpenMP + CUDA sm_75)
        run: |
          cmake -B kokkos-protos/build -S kokkos-protos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CUDA_HOST_COMPILER=g++-12 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build Kokkos prototype
        run: |
          cmake --build kokkos-protos/build --parallel

      - name: Run CTest harness (Serial, OpenMP, and CUDA backends)
        run: |
          ctest --test-dir kokkos-protos/build --output-on-failure

      - name: Show ccache statistics
        if: always()
        run: |
          command -v ccache >/dev/null 2>&1 && ccache -s || true

